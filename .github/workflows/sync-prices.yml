name: Daily price reconciliation

# Why daily rather than the monthly manual pass this replaces: on 2026-08-24 an
# ad-hoc check found four listed models carrying wrong prices, one understated
# by 79%. The monthly cadence did not catch it because nothing was watching
# between passes. Corrections land automatically; new models are reported for a
# human to write copy for.

on:
  schedule:
    # 06:15 UTC daily. Off the hour on purpose — GitHub's scheduler is busiest
    # exactly on the hour and delays cron runs accordingly.
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: price-sync
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconcile against LiteLLM registry
        id: sync
        run: |
          set +e
          node scripts/sync-prices.mjs --write > report.md 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # A tripped guard means the site is still serving a number this script
      # refused to touch. Reporting that as a green run would hide exactly the
      # problem the guard exists to surface, so it fails the workflow and files
      # an issue before anything else runs.
      - name: Escalate guard trip
        if: steps.sync.outputs.exit_code == '3'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🛑 Price sync halted — implausible price movement',
              labels: ['price-sync', 'needs-human'],
              body: [
                'The daily reconciliation found a price moving further than the safety threshold and **wrote nothing**.',
                '',
                'Until this is resolved by hand, the site keeps serving the current value — which may be the wrong one.',
                '',
                'Check the provider\'s own pricing page. If the move is real, edit `data/models.json` directly.',
                'If the registry entry is wrong, leave the data alone and re-run once upstream fixes it.',
                '',
                '<details><summary>Full report</summary>',
                '',
                '```',
                report.trim(),
                '```',
                '',
                '</details>',
                '',
                `_[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})._`,
              ].join('\n');
            });

      - name: Fail on guard trip or unreadable registry
        if: steps.sync.outputs.exit_code == '2' || steps.sync.outputs.exit_code == '3'
        run: |
          cat report.md
          echo "::error::Price sync did not complete cleanly (exit ${{ steps.sync.outputs.exit_code }}) — see report above."
          exit 1

      - name: Commit corrections
        id: commit
        run: |
          if git diff --quiet -- data/models.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No price changes to commit."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models.json
          git commit -F - <<'MSG'
          chore(data): 每日价格对账自动同步

          由 .github/workflows/sync-prices.yml 自动提交。变更明细见
          对应 workflow run 的 summary。

          仅同步已收录模型的价格/上下文/缓存价等机械字段；新模型不会
          自动加入（需要人工写文案与分类），而是开 Issue 提醒。
          MSG
          git push

      - name: Report new models
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            const section = report.split('### New models not on the site')[1];
            if (!section) {
              core.info('No new models reported.');
              return;
            }
            const title = 'New models detected in the LiteLLM registry';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'price-sync',
            });
            const body = [
              'The daily reconciliation found models that are priced in the registry but not listed on the site.',
              '',
              '### New models not on the site' + section.split('_Adding one needs')[0],
              '',
              'Each needs a name, tagline, description, category and use cases before it can be added —',
              'that is a judgement call, so the workflow reports rather than writes.',
              '',
              'Not worth covering? Add a pattern with its reason to `data/sync-ignore.json` and it will',
              'stop being reported.',
              '',
              `_Updated by [this run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})._`,
            ].join('\n');

            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
              core.info(`Updated issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['price-sync'],
              });
            }
